<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REG Vault | Game Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="bg-body-tertiary">
    <header class="bg-dark text-white shadow-sm">
      <div class="container py-4">
        <p class="text-uppercase small fw-semibold mb-1 text-warning">REG Vault</p>
        <h1 class="display-6 fw-bold mb-1">Retro game library</h1>
        <p class="mb-0 text-white-50">Browse, search, and discover games from classic systems.</p>
      </div>
    </header>

    <main class="container py-4">
      <section class="card border-0 shadow-sm mb-4" aria-labelledby="filters-heading">
        <div class="card-body">
          <h2 id="filters-heading" class="h5">Find a game</h2>
          <form id="search-form" class="row g-2">
            <div class="col-12 col-md-6">
              <label class="visually-hidden" for="search">Search titles</label>
              <input id="search" class="form-control" type="search" placeholder="Search by title">
            </div>
            <div class="col-12 col-md-4">
              <label class="visually-hidden" for="system">System</label>
              <select id="system" class="form-select">
                <option value="">All systems</option>
              </select>
            </div>
            <div class="col-12 col-md-2 d-grid">
              <button class="btn btn-warning" type="submit">Search</button>
            </div>
          </form>
        </div>
      </section>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <p id="results-summary" class="text-secondary mb-0" aria-live="polite">Loading games...</p>
        <label class="small text-secondary" for="limit">Per page
          <select id="limit" class="form-select form-select-sm d-inline-block w-auto ms-1">
            <option value="12">12</option>
            <option value="24">24</option>
            <option value="48">48</option>
          </select>
        </label>
      </div>

      <div id="status" class="alert d-none" role="alert"></div>
      <div id="games" class="row g-3"></div>
      <nav class="mt-4" aria-label="Game pages">
        <ul id="pagination" class="pagination justify-content-center"></ul>
      </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </body>
</html>
