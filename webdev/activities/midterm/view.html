<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deal details | CheapShark</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-body-tertiary">
    <header class="bg-dark text-white shadow-sm">
      <div class="container py-4">
        <div class="row align-items-start g-3">
          <div class="col">
            <p class="text-uppercase small fw-semibold mb-1 text-warning">
              CheapShark Deals
            </p>
            <h1 class="display-6 fw-bold mb-0">Deal details</h1>
          </div>
          <div class="col-auto">
            <button
              id="theme-toggle"
              class="btn btn-outline-light btn-sm"
              type="button"
              aria-pressed="false"
            >
              ☾ Night mode
            </button>
          </div>
        </div>
      </div>
    </header>
    <main class="container py-4">
      <a id="back-link" class="btn btn-outline-primary mb-4" href="index.html"
        >← Back to deals</a
      >
      <div id="status" class="alert d-none" role="alert"></div>
      <article
        id="details"
        class="card border-0 shadow-sm overflow-hidden"
      ></article>
    </main>

    <footer class="site-footer mt-5 py-4 text-center">
      <p class="mb-1">Built by Vergel Jr. D. Cutaran</p>
      <small>
        Deal data provided by
        <a
          href="https://apidocs.cheapshark.com/"
          target="_blank"
          rel="noopener noreferrer"
          >CheapShark API</a
        >
      </small>
    </footer>

    <script src="js/theme.js"></script>
    <script>
      const API = "https://www.cheapshark.com/api/1.0";
      const params = new URLSearchParams(window.location.search);
      const detailsEl = document.querySelector("#details");
      const statusEl = document.querySelector("#status");
      const showError = (message) => {
        statusEl.textContent = message;
        statusEl.className = "alert alert-danger";
      };

      const loadGame = async () => {
        const id = params.get("id");
        if (!id) return showError("A game was not specified.");
        const page = params.get("page");
        if (page)
          document.querySelector("#back-link").href =
            `index.html?page=${encodeURIComponent(page)}`;
        try {
          const response = await fetch(
            `${API}/games?id=${encodeURIComponent(id)}`,
          );
          if (!response.ok) throw new Error("Unable to load game details.");
          const game = await response.json();
          const storesResponse = await fetch(`${API}/stores`);
          const storeList = await storesResponse.json();
          const storeNames = new Map(
            storeList.map((store) => [store.storeID, store.storeName]),
          );
          document.title = `${game.info.title || "Game"} | CheapShark`;
          detailsEl.innerHTML = `
            <div class="row g-0">
              <div class="col-12 col-lg-4 detail-art-panel p-3 p-lg-4">
                <p class="detail-label mb-2">GAME COVER</p>
                <img class="detail-art rounded shadow-sm" src="${game.info.thumb}" alt="Cover art for ${game.info.title}">
              </div>
              <div class="col-12 col-lg-8">
                <div class="card-body p-3 p-lg-4">
                  <p class="text-secondary mb-1">DEAL RECORD / CURRENT OFFERS</p>
                  <h2 class="display-6 fw-bold">${game.info.title}</h2>
                  <p class="lead">Compare the available prices for this game.</p>
                  <div class="list-group">
                    ${game.deals.map((deal) => `<a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" href="https://www.cheapshark.com/redirect?dealID=${encodeURIComponent(deal.dealID)}" target="_blank" rel="noopener noreferrer"><span>${storeNames.get(deal.storeID) || "Online store"}</span><strong>$${deal.price}</strong></a>`).join("")}
                  </div>
                </div>
              </div>
            </div>`;
        } catch (error) {
          showError(error.message);
        }
      };
      loadGame();
    </script>
  </body>
</html>
