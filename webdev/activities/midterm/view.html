<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deal details | CheapShark</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/detail.css" />
  </head>
  <body class="bg-body-tertiary">
    <header class="bg-dark text-white shadow-sm">
      <div class="container py-4">
        <div class="row align-items-start g-3">
          <div class="col">
            <p class="text-uppercase small fw-semibold mb-1 text-warning">
              CheapShark / GAME DEAL DATABASE
            </p>
            <h1 class="display-6 fw-bold mb-0">
              <a
                class="sale-icon"
                href="https://www.flaticon.com/free-icons/info"
                title="info icons"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Info icon attribution"
                >ⓘ</a
              >
              Record details
            </h1>
          </div>
          <div
            class="col-12 col-sm-auto d-flex flex-column align-items-stretch gap-2"
          >
            <a class="btn btn-outline-light btn-sm" href="index.html">
              ⌂ Home
            </a>
            <a class="btn btn-outline-light btn-sm" href="index.html">
              ← Browse deals
            </a>
            <button
              id="theme-toggle"
              class="btn btn-outline-light btn-sm"
              type="button"
              aria-pressed="false"
            >
              ☾ Night mode
            </button>
          </div>
        </div>
      </div>
    </header>
    <main class="container py-4">
      <a id="back-link" class="btn btn-outline-primary mb-4" href="index.html"
        >← Back to deals</a
      >
      <div id="status" class="alert d-none" role="alert"></div>
      <article id="details" class="card border-0 shadow-sm overflow-hidden">
        <div class="card-body text-secondary">Loading record...</div>
      </article>
    </main>

    <footer class="site-footer mt-5 py-4 text-center">
      <p class="mb-1">Built by Vergel Jr. D. Cutaran</p>
      <small>
        Game deal data provided by
        <a
          href="https://apidocs.cheapshark.com/"
          target="_blank"
          rel="noopener noreferrer"
          >CheapShark API</a
        >
        <span class="d-block mt-2">
          Currency exchange rates provided by
          <a
            href="https://github.com/fawazahmed0/exchange-api"
            target="_blank"
            rel="noopener noreferrer"
            >Exchange API</a
          >
        </span>
        <span class="d-block mt-2">
          Info icons created by
          <a
            href="https://www.flaticon.com/free-icons/info"
            title="info icons"
            target="_blank"
            rel="noopener noreferrer"
            >Magnific - Flaticon</a
          >
        </span>
      </small>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/currency.js"></script>
    <script src="js/api.js"></script>
    <script src="js/detail.js"></script>
  </body>
</html>
